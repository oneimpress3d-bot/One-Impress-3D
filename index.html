<title>One Impress 3D | Impressão 3D em Teresina</title>
<meta name="description" content="Impressão 3D sob encomenda, peças personalizadas e miniaturas em Teresina, Piauí. Você imagina, a gente cria.">
<style>
:root{--bg:#000;--fg:#fff;--mute:#8f8f8f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mute:#8f8f8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#8f8f8f;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.logo{width:min(300px,76%);height:auto;display:block}
.logo.l{display:none}
.logo.d{mix-blend-mode:screen;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.l{display:none}:root:not([data-theme="light"]) .logo.d{display:block}}
:root[data-theme="dark"] .logo.l{display:none}
:root[data-theme="dark"] .logo.d{display:block}
p.slogan{margin-top:40px;font-size:clamp(20px,4vw,28px);font-weight:300;letter-spacing:-.01em}
p.loc{margin-top:10px;color:var(--mute);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.desc{margin-top:28px;color:var(--mute);font-size:15px;max-width:30ch;line-height:1.5}
.btns{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 28px;border:1px solid var(--fg);color:var(--fg);text-decoration:none;font-size:15px;font-weight:600;transition:opacity .2s}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn:hover{opacity:.7}
</style>
